<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title description">
  <title id="title">CIP Wayfinder agent communication</title>
  <desc id="description">Seven specialist agents and a quality reviewer exchange typed state before a human approves a Word package for download or separately authorized email delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52616B"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0A845F"/></marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#102A43}.subtitle{font:400 17px Arial,sans-serif;fill:#52616B}.name{font:700 18px Arial,sans-serif;fill:#102A43}.detail{font:400 14px Arial,sans-serif;fill:#334E68}.message{font:400 13px Arial,sans-serif;fill:#52616B}
      .line{fill:none;stroke:#52616B;stroke-width:2.5;marker-end:url(#arrow)}.approved{fill:none;stroke:#0A845F;stroke-width:3;marker-end:url(#greenArrow)}.dashed{fill:none;stroke:#B85C00;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1700" height="1120" fill="#F9FBFC"/><text x="70" y="60" class="title">CIP Wayfinder — agent communication</text><text x="70" y="90" class="subtitle">Typed handoffs move the review forward. Dashed paths show bounded validation and repair.</text>

  <rect x="70" y="145" width="250" height="92" rx="14" fill="#E1F2F7" stroke="#006C8F" stroke-width="2"/><text x="195" y="180" text-anchor="middle" class="name">Compliance analyst</text><text x="195" y="205" text-anchor="middle" class="detail">scope + authorized public PDF</text>
  <rect x="70" y="330" width="250" height="92" rx="14" fill="#E1F2F7" stroke="#006C8F" stroke-width="2"/><text x="195" y="365" text-anchor="middle" class="name">Local source tools</text><text x="195" y="390" text-anchor="middle" class="detail">PDF validation + cited retrieval</text>
  <rect x="70" y="515" width="250" height="92" rx="14" fill="#E1F2F7" stroke="#006C8F" stroke-width="2"/><text x="195" y="550" text-anchor="middle" class="name">Synthetic review tools</text><text x="195" y="575" text-anchor="middle" class="detail">evidence + baseline observations</text>

  <rect x="430" y="135" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="572" y="175" text-anchor="middle" class="name">1. Intake and Scope Agent</text><text x="572" y="202" text-anchor="middle" class="detail">checks required scope fields</text><text x="572" y="224" text-anchor="middle" class="detail">asks instead of guessing</text>
  <rect x="855" y="135" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="997" y="175" text-anchor="middle" class="name">2. Requirement and Citation</text><text x="997" y="202" text-anchor="middle" class="detail">retrieves approved sources</text><text x="997" y="224" text-anchor="middle" class="detail">returns mappings + citations</text>
  <rect x="1280" y="135" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="1422" y="175" text-anchor="middle" class="name">3. Control Drafting Agent</text><text x="1422" y="202" text-anchor="middle" class="detail">creates traceable draft controls</text><text x="1422" y="224" text-anchor="middle" class="detail">keeps requirement IDs attached</text>
  <path d="M320 190 H430" class="line"/><text x="375" y="174" text-anchor="middle" class="message">scoped case</text><path d="M715 195 H855" class="line"/><text x="785" y="179" text-anchor="middle" class="message">validated scope</text><path d="M1140 195 H1280" class="line"/><text x="1210" y="179" text-anchor="middle" class="message">cited requirements</text>

  <rect x="430" y="455" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="572" y="495" text-anchor="middle" class="name">4. Evidence Insight Agent</text><text x="572" y="522" text-anchor="middle" class="detail">extracts observable facts only</text><text x="572" y="544" text-anchor="middle" class="detail">ignores embedded instructions</text>
  <rect x="855" y="455" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="997" y="495" text-anchor="middle" class="name">5. Risk and Remediation</text><text x="997" y="522" text-anchor="middle" class="detail">forms potential findings</text><text x="997" y="544" text-anchor="middle" class="detail">creates an ordered draft plan</text>
  <rect x="1280" y="455" width="285" height="120" rx="16" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><text x="1422" y="495" text-anchor="middle" class="name">6. Review Package Agent</text><text x="1422" y="522" text-anchor="middle" class="detail">assembles grounded drafts</text><text x="1422" y="544" text-anchor="middle" class="detail">preserves sources + IDs</text>
  <path d="M1422 255 V385 H572 V455" class="line"/><text x="1000" y="370" text-anchor="middle" class="message">draft controls + requirement IDs</text><path d="M715 515 H855" class="line"/><text x="785" y="499" text-anchor="middle" class="message">facts + gaps</text><path d="M1140 515 H1280" class="line"/><text x="1210" y="499" text-anchor="middle" class="message">findings + plan</text>
  <path d="M320 376 H785 V195 H855" class="line"/><text x="525" y="358" text-anchor="middle" class="message">approved chunks + citation metadata</text><path d="M320 561 H430" class="line"/><text x="375" y="545" text-anchor="middle" class="message">synthetic evidence</text><path d="M320 588 C610 705 780 665 855 575" class="line"/><text x="585" y="680" text-anchor="middle" class="message">baseline observations</text>

  <rect x="705" y="735" width="300" height="108" rx="14" fill="#FFF0E0" stroke="#B85C00" stroke-width="2"/><text x="855" y="773" text-anchor="middle" class="name">Quality Reviewer</text><text x="855" y="800" text-anchor="middle" class="detail">checks citations and control links</text><text x="855" y="823" text-anchor="middle" class="detail">approves handoff or requests repair</text>
  <path d="M997 575 V735" class="dashed"/><text x="1022" y="659" class="message">draft package</text><path d="M705 790 C590 855 505 765 572 575" class="dashed"/><text x="555" y="842" text-anchor="middle" class="message">one repair request</text>
  <rect x="1250" y="735" width="315" height="108" rx="14" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1407" y="773" text-anchor="middle" class="name">7. Human Handoff Agent</text><text x="1407" y="800" text-anchor="middle" class="detail">approve · edit · reject</text><text x="1407" y="823" text-anchor="middle" class="detail">role + rationale required</text>
  <path d="M1005 789 H1250" class="approved"/><text x="1127" y="772" text-anchor="middle" class="message">validated package</text><path d="M1422 575 V735" class="approved"/>

  <rect x="900" y="945" width="290" height="94" rx="14" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1045" y="981" text-anchor="middle" class="name">Approved Word package</text><text x="1045" y="1008" text-anchor="middle" class="detail">created in memory</text>
  <path d="M1407 843 V900 H1045 V945" class="approved"/>
  <rect x="1260" y="900" width="270" height="82" rx="14" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1395" y="934" text-anchor="middle" class="name">Direct download</text><text x="1395" y="960" text-anchor="middle" class="detail">local .docx</text>
  <rect x="1260" y="1010" width="270" height="82" rx="14" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1395" y="1044" text-anchor="middle" class="name">Email delivery</text><text x="1395" y="1070" text-anchor="middle" class="detail">separate send consent</text>
  <path d="M1190 992 H1220 V941 H1260" class="approved"/><path d="M1190 992 H1220 V1051 H1260" class="approved"/>
  <text x="70" y="1090" class="subtitle">Safety boundary: agents draft and validate; a person decides whether the package may be downloaded or emailed.</text>
</svg>
