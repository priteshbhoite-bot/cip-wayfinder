<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title description">
  <title id="title">CIP Wayfinder review and delivery flow</title>
  <desc id="description">Five clear review stages lead to an approved Word package that can be downloaded or emailed with separate authorization.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#52616B"/></marker><marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#0A845F"/></marker>
    <style>.title{font:700 36px Arial,sans-serif;fill:#102A43}.subtitle{font:400 18px Arial,sans-serif;fill:#52616B}.step{font:700 19px Arial,sans-serif;fill:#102A43}.detail{font:400 15px Arial,sans-serif;fill:#334E68}.num{font:700 22px Arial,sans-serif;fill:#FFFFFF}.line{fill:none;stroke:#52616B;stroke-width:3;marker-end:url(#arrow)}.green{fill:none;stroke:#0A845F;stroke-width:3;marker-end:url(#greenArrow)}</style></defs>
  <rect width="1800" height="980" fill="#FFFFFF"/><text x="70" y="62" class="title">CIP Wayfinder review and delivery flow</text><text x="70" y="96" class="subtitle">Each stage stays human-readable, source-linked, and approval controlled.</text>
  <g><rect x="70" y="185" width="280" height="190" rx="18" fill="#EAF4FA" stroke="#2E74B5" stroke-width="3"/><circle cx="115" cy="225" r="24" fill="#2E74B5"/><text x="115" y="233" text-anchor="middle" class="num">1</text><text x="210" y="270" text-anchor="middle" class="step">Upload and scope</text><text x="210" y="302" text-anchor="middle" class="detail">Authorized public CIP PDF</text><text x="210" y="328" text-anchor="middle" class="detail">entity · region · asset scope</text></g>
  <g><rect x="410" y="185" width="280" height="190" rx="18" fill="#EAF4FA" stroke="#2E74B5" stroke-width="3"/><circle cx="455" cy="225" r="24" fill="#2E74B5"/><text x="455" y="233" text-anchor="middle" class="num">2</text><text x="550" y="270" text-anchor="middle" class="step">Retrieve and summarize</text><text x="550" y="302" text-anchor="middle" class="detail">Vital information in plain language</text><text x="550" y="328" text-anchor="middle" class="detail">citation retained for verification</text></g>
  <g><rect x="750" y="185" width="280" height="190" rx="18" fill="#ECEEFA" stroke="#4F5D95" stroke-width="3"/><circle cx="795" cy="225" r="24" fill="#4F5D95"/><text x="795" y="233" text-anchor="middle" class="num">3</text><text x="890" y="270" text-anchor="middle" class="step">Review draft guidance</text><text x="890" y="302" text-anchor="middle" class="detail">controls · owners · evidence</text><text x="890" y="328" text-anchor="middle" class="detail">remediation steps</text></g>
  <g><rect x="1090" y="185" width="280" height="190" rx="18" fill="#FFF0E0" stroke="#B85C00" stroke-width="3"/><circle cx="1135" cy="225" r="24" fill="#B85C00"/><text x="1135" y="233" text-anchor="middle" class="num">4</text><text x="1230" y="270" text-anchor="middle" class="step">Make a human decision</text><text x="1230" y="302" text-anchor="middle" class="detail">approve · edit · reject</text><text x="1230" y="328" text-anchor="middle" class="detail">role + rationale required</text></g>
  <g><rect x="1430" y="185" width="280" height="190" rx="18" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><circle cx="1475" cy="225" r="24" fill="#0A845F"/><text x="1475" y="233" text-anchor="middle" class="num">5</text><text x="1570" y="270" text-anchor="middle" class="step">Create Word package</text><text x="1570" y="302" text-anchor="middle" class="detail">Approved content only</text><text x="1570" y="328" text-anchor="middle" class="detail">generated in memory</text></g>
  <path d="M350 280 H410" class="line"/><path d="M690 280 H750" class="line"/><path d="M1030 280 H1090" class="line"/><path d="M1370 280 H1430" class="green"/>

  <rect x="1030" y="610" width="300" height="150" rx="18" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1180" y="661" text-anchor="middle" class="step">Direct download</text><text x="1180" y="695" text-anchor="middle" class="detail">Save the approved .docx</text><text x="1180" y="721" text-anchor="middle" class="detail">to the user's device</text>
  <rect x="1430" y="610" width="300" height="150" rx="18" fill="#E2F4ED" stroke="#0A845F" stroke-width="3"/><text x="1580" y="661" text-anchor="middle" class="step">Email a copy</text><text x="1580" y="695" text-anchor="middle" class="detail">Enter the recipient</text><text x="1580" y="721" text-anchor="middle" class="detail">and separately authorize send</text>
  <path d="M1570 375 V500 H1180 V610" class="green"/><path d="M1570 375 V610" class="green"/>
  <text x="1375" y="485" text-anchor="middle" class="subtitle">Choose either delivery option after package approval</text>
  <rect x="70" y="835" width="1660" height="78" rx="14" fill="#F2F4F7" stroke="#D9D9D9" stroke-width="2"/><text x="900" y="869" text-anchor="middle" class="step">Human review remains required</text><text x="900" y="896" text-anchor="middle" class="detail">The summary and draft package support analysis; they do not replace official NERC language or make a compliance determination.</text>
</svg>
