<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">CIP Wayfinder system architecture</title>
<desc id="desc">Connected local product flow with source fallback, package assembly, structural review and human-controlled delivery. A separate panel shows the synthetic LangGraph demonstration, not invoked by the product UI.</desc>
<defs>
 <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#52616B"/></marker>
 <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0A845F"/></marker>
 <style>text{font-family:Arial,sans-serif;fill:#102A43}.title{font-size:34px;font-weight:700}.head{font-size:22px;font-weight:700}.small{font-size:18px;fill:#52616B}.label{font-size:18px;font-weight:700}.box{fill:#E1F2F7;stroke:#0081A2;stroke-width:2}.review{fill:#ECEEFA;stroke:#5964A4;stroke-width:2}.safe{fill:#E2F4ED;stroke:#00946F;stroke-width:2}.stop{fill:#FCE8E6;stroke:#D64545;stroke-width:2}.line{fill:none;stroke:#52616B;stroke-width:2.5;marker-end:url(#a)}.green{fill:none;stroke:#0A845F;stroke-width:2.5;marker-end:url(#g)}</style>
</defs>
<rect width="1600" height="1200" fill="#F9FBFC"/>
<text x="45" y="52" class="title">CIP Wayfinder architecture</text>
<text x="45" y="83" class="small">Current product flow — local source-grounded drafts with explicit human control over delivery</text>

<rect x="45" y="145" width="190" height="105" rx="14" fill="white" stroke="#B7D2DB" stroke-width="2"/>
<text x="140" y="183" text-anchor="middle" class="head">Analyst</text><text x="140" y="216" text-anchor="middle" class="small">Public PDF + scope</text>
<rect x="280" y="145" width="225" height="105" rx="14" class="box"/>
<text x="392" y="183" text-anchor="middle" class="head">CIP Wayfinder</text><text x="392" y="216" text-anchor="middle" class="small">Streamlit interface</text>
<path d="M235 197H280" class="line"/>
<rect x="550" y="125" width="355" height="145" rx="14" class="box"/>
<text x="727" y="159" text-anchor="middle" class="head">Scope and PDF validation</text>
<text x="727" y="192" text-anchor="middle" class="small">Functional Entity + Regional Entity</text>
<text x="727" y="220" text-anchor="middle" class="small">Authorized searchable public PDF</text>
<text x="727" y="247" text-anchor="middle" class="small">Missing scope → ask before proceeding</text>
<path d="M505 197H550" class="line"/>
<rect x="1040" y="115" width="465" height="95" rx="14" class="box"/>
<text x="1272" y="150" text-anchor="middle" class="head">Approved local corpus</text><text x="1272" y="183" text-anchor="middle" class="small">Read-only SQLite · version-matched sources</text>
<rect x="1040" y="250" width="465" height="95" rx="14" class="box"/>
<text x="1272" y="285" text-anchor="middle" class="head">Validated uploaded-source fallback</text><text x="1272" y="318" text-anchor="middle" class="small">Bounded text + locator · verification flagged</text>
<path d="M905 176H1040" class="line"/><text x="928" y="159" class="small">Prefer match</text>
<path d="M905 237H965V297H1040" class="line"/><text x="926" y="330" class="small">If unmatched</text>

<rect x="1080" y="410" width="425" height="110" rx="14" class="review"/>
<text x="1292" y="448" text-anchor="middle" class="head">Requirement-aware control drafting</text><text x="1292" y="482" text-anchor="middle" class="small">Draft controls + ordered remediation</text>
<path d="M1505 163H1540V379H1292V410" class="line"/><path d="M1272 345V379H1292" fill="none" stroke="#52616B" stroke-width="2.5"/>
<rect x="650" y="410" width="350" height="110" rx="14" class="review"/>
<text x="825" y="448" text-anchor="middle" class="head">Review Package Agent</text><text x="825" y="482" text-anchor="middle" class="small">Assemble drafts + preserve source links</text>
<path d="M1080 465H1000" class="line"/>
<rect x="270" y="410" width="300" height="110" rx="14" class="review"/>
<text x="420" y="448" text-anchor="middle" class="head">Quality Reviewer</text><text x="420" y="482" text-anchor="middle" class="small">Structural and traceability checks</text>
<path d="M650 465H570" class="line"/>
<text x="420" y="558" text-anchor="middle" class="small">Valid package only</text><path d="M420 520V590" class="line"/>
<rect x="270" y="590" width="300" height="115" rx="14" class="safe"/>
<text x="420" y="630" text-anchor="middle" class="head">Human package decision</text><text x="420" y="667" text-anchor="middle" class="small">Approve · needs editing · reject</text>
<rect x="40" y="590" width="190" height="115" rx="14" class="stop"/>
<text x="135" y="630" text-anchor="middle" class="head">No document</text><text x="135" y="662" text-anchor="middle" class="small">Edit / reject /</text><text x="135" y="686" text-anchor="middle" class="small">invalid package</text>
<path d="M270 649H230" class="line"/><path d="M270 466H135V590" class="line"/>
<rect x="650" y="590" width="350" height="115" rx="14" class="safe"/>
<text x="825" y="630" text-anchor="middle" class="head">Approved Word package</text><text x="825" y="667" text-anchor="middle" class="small">Created locally in memory</text>
<path d="M570 649H650" class="green"/><text x="582" y="629" class="small">Approve</text>
<rect x="1140" y="565" width="365" height="90" rx="14" class="safe"/>
<text x="1322" y="601" text-anchor="middle" class="head">Direct download</text><text x="1322" y="630" text-anchor="middle" class="small">Local .docx delivery</text>
<rect x="1140" y="695" width="365" height="90" rx="14" class="safe"/>
<text x="1322" y="731" text-anchor="middle" class="head">Optional SMTP email</text><text x="1322" y="760" text-anchor="middle" class="small">Recipient preview + separate send approval</text>
<path d="M1000 649H1070V610H1140" class="green"/><path d="M1070 649V740H1140" class="green"/>
<text x="45" y="759" class="label">Fixed objective</text><text x="45" y="788" class="small">Prepare a source-grounded draft package for SME tailoring.</text>

<rect x="40" y="830" width="1510" height="300" rx="18" fill="#F0F1F9" stroke="#5964A4" stroke-width="2" stroke-dasharray="10 6"/>
<text x="65" y="867" class="head">Separate LangGraph demonstration — synthetic data; not called by the Streamlit product path</text>
<rect x="65" y="898" width="820" height="100" rx="12" class="review"/>
<text x="85" y="934" class="head">Synthetic specialist pipeline</text>
<text x="85" y="965" class="small">Intake → requirements → controls → evidence / baseline → insights → risk → remediation</text>
<rect x="960" y="898" width="220" height="100" rx="12" class="safe"/>
<text x="1070" y="934" text-anchor="middle" class="head">Approval interrupt</text><text x="1070" y="965" text-anchor="middle" class="small">Edit → pause again</text>
<path d="M885 948H960" class="line"/>
<rect x="1270" y="898" width="255" height="100" rx="12" class="safe"/>
<text x="1397" y="934" text-anchor="middle" class="head">Guarded local export</text><text x="1397" y="965" text-anchor="middle" class="small">Approved synthetic JSON only</text>
<path d="M1180 948H1270" class="green"/><text x="1189" y="927" class="small">Approve</text>
<text x="65" y="1045" class="label">State: thread_id + InMemorySaver · typed state + Pydantic-validated records</text>
<text x="65" y="1083" class="small">Recovery: at most 2 retries and 1 repair · exhausted recovery or rejection → safe stop, no export</text>
<text x="45" y="1170" class="small">Draft guidance requires source verification and human tailoring. No compliance determination, live IT/OT access or operational changes.</text>
</svg>
