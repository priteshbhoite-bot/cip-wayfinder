[project]
name = "nerc-compliance-intelligence"
version = "0.1.0"
description = "Local, synthetic-data application for source-grounded CIP review workflow design."
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "langgraph>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.2,<2.0",
    "streamlit>=1.40,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nerc_compliance_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
